<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Tolak / Revisi Permintaan</title>
<style>
  :root { --bg:#e9e9ec; --kartu:#fff; --teks:#1b1b1f; --redup:#6b6b73; --garis:#c9c9d0; --bahaya:#c0392b; --ok:#1e8e4e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121214; --kartu:#1c1c20; --teks:#ececf0; --redup:#9a9aa4; --garis:#3a3a42; --bahaya:#ef6b5b; --ok:#4cc27f; } }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--teks); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:18px 16px 40px; }
  .kartu { background:var(--kartu); border:1px solid var(--garis); border-radius:16px; padding:18px; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  .sub { color:var(--redup); font-size:.88rem; margin:0 0 14px; }
  label { display:block; font-weight:600; font-size:.9rem; margin-bottom:6px; }
  textarea { width:100%; min-height:130px; padding:10px 12px; border:1px solid var(--garis); border-radius:12px; background:transparent; color:inherit; font:inherit; resize:vertical; }
  .tombol { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  button, a.btn { flex:1; min-width:140px; padding:12px 16px; border-radius:12px; border:1px solid var(--garis); background:transparent; color:inherit; font:inherit; font-weight:600; text-align:center; text-decoration:none; cursor:pointer; }
  button.utama { background:var(--bahaya); border-color:var(--bahaya); color:#fff; }
  button:disabled { opacity:.6; cursor:default; }
  #pesan { margin-top:12px; font-size:.92rem; }
  .gagal { color:var(--bahaya); } .sukses { color:var(--ok); font-weight:600; }
  .hitung { text-align:right; color:var(--redup); font-size:.78rem; margin-top:4px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="aset/tema-ringan.css?v=1.253">
</head>
<body>
<main>
  <div class="kartu" id="kartu">
    <h1>Tolak / Revisi permintaan seragam</h1>
    <p class="sub" id="sub">Tulis alasan atau bagian yang perlu direvisi. Alasan ini tampil di web administrasi.</p>
    <form id="f">
      <label for="alasan">Alasan / catatan revisi</label>
      <textarea id="alasan" maxlength="500" placeholder="Contoh: jumlah celana melebihi anggota, mohon dicek ulang" required></textarea>
      <div class="hitung"><span id="n">0</span>/500</div>
      <div class="tombol"><button class="utama" id="kirim" type="submit">Kirim penolakan</button></div>
    </form>
    <div id="pesan" role="status"></div>
  </div>
</main>
<script>
  // Parameter dari tombol di notifikasi: id = nomor permintaan, p = pimpinan (yasir|ferry), t = token pribadi pimpinan tersebut.
  const FN = 'https://vqcusagijiavaoljfrib.supabase.co/functions/v1/keputusan';
  const q = new URLSearchParams(location.search), id = q.get('id') || '', p = q.get('p') || '', t = q.get('t') || '', m = q.get('m') === 'peralatan' ? '&m=peralatan' : '';
  const $ = i => document.getElementById(i);
  const nama = { yasir: 'Pak Yasir', ferry: 'Pak Ferry' }[p];
  if (!/^\d+$/.test(id) || !nama || t.length < 32) { $('f').hidden = true; $('sub').textContent = ''; $('pesan').innerHTML = '<span class="gagal">Tautan tidak valid.</span>'; }
  else $('sub').textContent = `${nama}, tulis alasan atau bagian yang perlu direvisi. Alasan ini tampil di web administrasi.`;
  $('alasan').oninput = () => { $('n').textContent = $('alasan').value.length; };
  $('f').onsubmit = async e => {
    e.preventDefault();
    const alasan = $('alasan').value.trim(); if (!alasan) return;
    $('kirim').disabled = true; $('kirim').textContent = 'Mengirim…'; $('pesan').textContent = '';
    try {
      const r = await fetch(`${FN}?id=${encodeURIComponent(id)}&p=${encodeURIComponent(p)}&t=${encodeURIComponent(t)}&a=tolak${m}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ alasan }) });
      const teks = await r.text();
      if (r.ok) { $('f').hidden = true; $('pesan').innerHTML = ''; const s = document.createElement('div'); s.className = 'sukses'; s.textContent = teks; $('pesan').append(s); }
      else { const s = document.createElement('span'); s.className = 'gagal'; s.textContent = teks || 'Gagal mengirim.'; $('pesan').append(s); $('kirim').disabled = false; $('kirim').textContent = 'Kirim penolakan'; }
    } catch (x) { $('pesan').innerHTML = '<span class="gagal">Tidak bisa terhubung. Periksa koneksi lalu coba lagi.</span>'; $('kirim').disabled = false; $('kirim').textContent = 'Kirim penolakan'; }
  };
</script>
</body>
</html>
