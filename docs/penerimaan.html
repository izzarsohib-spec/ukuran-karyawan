<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Form Penerimaan Seragam</title>
<style>
  :root { --bg:#e9e9ec; --kartu:#fff; --teks:#1b1b1f; --redup:#6b6b73; --garis:#c9c9d0; --bahaya:#c0392b; --ok:#1e8e4e; --aksen:#0070c0; --warn:#b9770e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121214; --kartu:#1c1c20; --teks:#ececf0; --redup:#9a9aa4; --garis:#3a3a42; --bahaya:#ef6b5b; --ok:#4cc27f; --aksen:#59a9ee; --warn:#e0a84a; } }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--teks); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px 16px 60px; }
  .kartu { background:var(--kartu); border:1px solid var(--garis); border-radius:16px; padding:16px; margin-bottom:14px; }
  h1 { font-size:1.2rem; margin:0 0 2px; } h2 { font-size:1rem; margin:0 0 10px; }
  .sub { color:var(--redup); font-size:.88rem; margin:0 0 12px; }
  .rl { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid var(--garis); font-size:.9rem; }
  .rl:last-child { border-bottom:0; } .rl span:first-child { color:var(--redup); } .rl span:last-child { text-align:right; font-weight:600; }
  label { display:block; font-weight:600; font-size:.88rem; margin:12px 0 5px; }
  input[type=text], input[type=date], select, textarea { width:100%; padding:10px 12px; border:1px solid var(--garis); border-radius:12px; background:transparent; color:inherit; font:inherit; }
  textarea { min-height:70px; resize:vertical; }
  .baris { border:1px solid var(--garis); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .baris .nm { font-weight:600; } .baris .dt { color:var(--redup); font-size:.84rem; }
  .pilih { display:flex; gap:8px; margin-top:8px; }
  .pilih button { flex:1; padding:9px; border-radius:10px; border:1px solid var(--garis); background:transparent; color:inherit; font:inherit; font-weight:600; }
  .pilih button.on.ok { background:var(--ok); border-color:var(--ok); color:#fff; } .pilih button.on.bad { background:var(--bahaya); border-color:var(--bahaya); color:#fff; }
  .masalah { margin-top:8px; display:none; } .baris.bermasalah .masalah { display:block; }
  .ttd { border:1px dashed var(--garis); border-radius:12px; background:#fff; touch-action:none; width:100%; height:160px; display:block; }
  .aksi { display:flex; gap:8px; margin-top:6px; } .aksi button, .aksi label.tombol { flex:1; padding:9px 12px; border-radius:10px; border:1px solid var(--garis); background:transparent; color:inherit; font:inherit; text-align:center; cursor:pointer; margin:0; font-weight:600; }
  .foto { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; } .foto div { position:relative; } .foto img { width:92px; height:92px; object-fit:cover; border-radius:10px; border:1px solid var(--garis); }
  .foto button { position:absolute; top:-6px; right:-6px; width:24px; height:24px; border-radius:50%; border:0; background:var(--bahaya); color:#fff; font-size:.9rem; line-height:1; }
  .kirim { width:100%; padding:14px; border-radius:14px; border:0; background:var(--aksen); color:#fff; font:inherit; font-weight:700; font-size:1.02rem; cursor:pointer; }
  .kirim:disabled { opacity:.6; } #pesan { margin-top:10px; font-size:.92rem; } .gagal { color:var(--bahaya); } .sukses { color:var(--ok); font-weight:600; }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.78rem; background:rgba(128,128,128,.18); }
</style>
</head>
<body>
<main>
  <div class="kartu" id="info"><h1>Form Penerimaan Seragam</h1><p class="sub" id="sub">Memuat data surat jalan…</p><div id="meta"></div></div>
  <form id="f" hidden>
    <div class="kartu"><h2>1. Periksa barang yang diterima</h2><p class="sub">Tandai tiap baris. Bila ada yang tidak sesuai, pilih alasannya dan tulis catatannya.</p><div id="daftar"></div></div>
    <div class="kartu"><h2>2. Data penerima</h2>
      <label for="penerima">Nama penerima</label><input type="text" id="penerima" maxlength="120" required autocomplete="name">
      <label for="jabatan">Jabatan (opsional)</label><input type="text" id="jabatan" maxlength="80">
      <label for="tgl">Tanggal terima</label><input type="date" id="tgl" required>
      <label for="picNama">Nama PIC lapangan</label><input type="text" id="picNama" maxlength="120" required>
      <label for="catatan">Catatan umum (opsional)</label><textarea id="catatan" maxlength="800" placeholder="Mis. kondisi kemasan, barang datang terlambat"></textarea></div>
    <div class="kartu"><h2>3. Tanda tangan</h2>
      <label>Tanda tangan penerima</label><canvas class="ttd" id="ttdPenerima"></canvas><div class="aksi"><button type="button" data-hapus="ttdPenerima">Hapus tanda tangan</button></div>
      <label>Tanda tangan PIC lapangan</label><canvas class="ttd" id="ttdPic"></canvas><div class="aksi"><button type="button" data-hapus="ttdPic">Hapus tanda tangan</button></div></div>
    <div class="kartu"><h2>4. Foto dokumentasi</h2><p class="sub">Foto barang yang diterima (maksimal 6 foto).</p>
      <div class="aksi"><label class="tombol" for="fotoIn">Ambil / pilih foto</label></div><input type="file" id="fotoIn" accept="image/*" multiple hidden><div class="foto" id="foto"></div></div>
    <button class="kirim" id="kirim" type="submit">Kirim penerimaan</button><div id="pesan" role="status"></div>
  </form>
</main>
<script>
  const FN = 'https://vqcusagijiavaoljfrib.supabase.co/functions/v1/penerimaan';
  const q = new URLSearchParams(location.search), id = q.get('id') || '', t = q.get('t') || '';
  const $ = i => document.getElementById(i), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let rows = [], status = {}, fotos = [];
  const STATUS_TEKS = { kurang: 'Barang kurang / tidak ada', rusak: 'Barang rusak', salah_ukuran: 'Ukuran tidak sesuai' };

  // ---- kanvas tanda tangan ----
  function pasangTtd(kanvas) {
    const c = $(kanvas), x = c.getContext('2d'); let gambar = false, ada = false;
    const ukur = () => { const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1; c.width = Math.round(r.width * d); c.height = Math.round(r.height * d); x.setTransform(d, 0, 0, d, 0, 0); x.lineWidth = 2.2; x.lineCap = 'round'; x.strokeStyle = '#111'; };
    const titik = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    c.addEventListener('pointerdown', e => { gambar = true; ada = true; c.setPointerCapture(e.pointerId); const [a, b] = titik(e); x.beginPath(); x.moveTo(a, b); x.lineTo(a + .1, b + .1); x.stroke(); });
    c.addEventListener('pointermove', e => { if (!gambar) return; const [a, b] = titik(e); x.lineTo(a, b); x.stroke(); });
    ['pointerup', 'pointercancel'].forEach(n => c.addEventListener(n, () => { gambar = false; }));
    c.hapus = () => { x.clearRect(0, 0, c.width, c.height); ada = false; };
    c.kosong = () => !ada; c.data = () => c.toDataURL('image/png');
    ukur();
  }
  document.addEventListener('click', e => { const b = e.target.closest('[data-hapus]'); if (b) $(b.dataset.hapus).hapus(); });

  // ---- foto: diperkecil dulu di perangkat ----
  const kecilkan = file => new Promise((ok, no) => { const img = new Image(), u = URL.createObjectURL(file); img.onload = () => { const m = 1280, s = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.72)); }; img.onerror = () => no(new Error('Foto tidak terbaca')); img.src = u; });
  function renderFoto() { $('foto').innerHTML = fotos.map((f, i) => `<div><img src="${f}" alt="foto ${i + 1}"><button type="button" data-fx="${i}" aria-label="Hapus foto">×</button></div>`).join(''); }
  $('fotoIn').onchange = async e => { for (const f of [...e.target.files]) { if (fotos.length >= 6) break; try { fotos.push(await kecilkan(f)); } catch (x) { /* lewati */ } } e.target.value = ''; renderFoto(); };
  $('foto').onclick = e => { const b = e.target.closest('[data-fx]'); if (b) { fotos.splice(Number(b.dataset.fx), 1); renderFoto(); } };

  // ---- daftar barang ----
  const ukTeks = r => [r.ukuran_baju && 'Baju ' + r.ukuran_baju, r.ukuran_celana && 'Celana ' + r.ukuran_celana, r.ukuran_sepatu && 'Sepatu ' + r.ukuran_sepatu].filter(Boolean).join(' · ') || '-';
  function renderDaftar() {
    $('daftar').innerHTML = rows.map(r => { const s = status[r.id] || { st: 'sesuai', cat: '' }, bad = s.st !== 'sesuai';
      return `<div class="baris ${bad ? 'bermasalah' : ''}" data-id="${r.id}"><div class="nm">${esc(r.nama)}</div><div class="dt">${esc(r.item_nama)} · ${esc(ukTeks(r))} · ${r.qty} pcs</div>
        <div class="pilih"><button type="button" data-s="sesuai" class="${!bad ? 'on ok' : ''}">Sesuai</button><button type="button" data-s="masalah" class="${bad ? 'on bad' : ''}">Ada masalah</button></div>
        <div class="masalah"><select data-alasan>${Object.entries(STATUS_TEKS).map(([k, v]) => `<option value="${k}" ${s.st === k ? 'selected' : ''}>${v}</option>`).join('')}</select><textarea data-cat placeholder="Catatan wajib diisi" style="margin-top:6px;min-height:54px">${esc(s.cat)}</textarea></div></div>`; }).join('');
  }
  $('daftar').onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; const id = Number(b.closest('.baris').dataset.id), cur = status[id] || { st: 'sesuai', cat: '' };
    status[id] = b.dataset.s === 'sesuai' ? { st: 'sesuai', cat: '' } : { st: cur.st === 'sesuai' ? 'kurang' : cur.st, cat: cur.cat }; renderDaftar(); };
  $('daftar').onchange = e => { const id = Number(e.target.closest('.baris').dataset.id); if (e.target.matches('[data-alasan]')) status[id] = { ...status[id], st: e.target.value }; };
  $('daftar').oninput = e => { const id = Number(e.target.closest('.baris').dataset.id); if (e.target.matches('[data-cat]')) status[id] = { ...status[id], cat: e.target.value }; };

  async function muat() {
    if (!/^\d+$/.test(id) || t.length < 32) { $('sub').innerHTML = '<span class="gagal">Tautan tidak valid.</span>'; return; }
    try {
      const r = await fetch(`${FN}?id=${encodeURIComponent(id)}&t=${encodeURIComponent(t)}`), j = await r.json();
      if (!r.ok) { $('sub').innerHTML = `<span class="gagal">${esc(j.error || 'Tautan tidak dikenali.')}</span>`; return; }
      $('sub').textContent = 'Form ini khusus untuk penerima barang di lokasi.';
      $('meta').innerHTML = [['No. surat jalan', j.no_surat_jalan], ['Tanggal kirim', new Date(j.tanggal + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })], ['Lokasi', j.client], ['Bagian kerja', j.bagian], ['Ekspedisi', (j.ekspedisi || '-') + (j.no_resi ? ' · resi ' + j.no_resi : '')], ['Jumlah barang', j.rows.reduce((a, r) => a + r.qty, 0) + ' pcs']].map(([a, b]) => `<div class="rl"><span>${a}</span><span>${esc(b)}</span></div>`).join('');
      if (j.sudah) { $('meta').innerHTML += `<div class="sukses" style="margin-top:10px">Penerimaan sudah diisi oleh ${esc(j.sudah.penerima)} pada ${new Date(j.sudah.tanggal_terima + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}. Terima kasih.</div>`; return; }
      rows = j.rows; $('picNama').value = j.pic_nama || ''; $('tgl').value = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
      renderDaftar(); $('f').hidden = false; pasangTtd('ttdPenerima'); pasangTtd('ttdPic');
    } catch (e) { $('sub').innerHTML = '<span class="gagal">Tidak bisa terhubung. Periksa koneksi lalu muat ulang.</span>'; }
  }
  $('f').onsubmit = async e => {
    e.preventDefault(); const ps = $('pesan'); ps.className = ''; ps.textContent = '';
    const salah = rows.find(r => (status[r.id] || {}).st && status[r.id].st !== 'sesuai' && !String(status[r.id].cat || '').trim());
    if (salah) { ps.className = 'gagal'; ps.textContent = `Tulis catatan untuk ${salah.nama} (baris bermasalah).`; return; }
    if ($('ttdPenerima').kosong() || $('ttdPic').kosong()) { ps.className = 'gagal'; ps.textContent = 'Tanda tangan penerima dan PIC wajib diisi.'; return; }
    const masalah = rows.filter(r => (status[r.id] || {}).st && status[r.id].st !== 'sesuai').length;
    if (!confirm(`Kirim penerimaan? ${rows.length - masalah} baris sesuai${masalah ? `, ${masalah} bermasalah` : ''}. Setelah dikirim tidak bisa diubah.`)) return;
    $('kirim').disabled = true; $('kirim').textContent = 'Mengirim…';
    try {
      const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: Number(id), t, penerima: $('penerima').value, jabatan: $('jabatan').value, pic_nama: $('picNama').value, tanggal_terima: $('tgl').value, catatan: $('catatan').value,
        item: rows.map(x => ({ id: x.id, status: (status[x.id] || {}).st || 'sesuai', catatan: (status[x.id] || {}).cat || '' })), ttd_penerima: $('ttdPenerima').data(), ttd_pic: $('ttdPic').data(), foto: fotos }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
      $('f').hidden = true; $('meta').innerHTML += '<div class="sukses" style="margin-top:12px">Penerimaan berhasil dikirim. Terima kasih.</div>'; window.scrollTo({ top: 0 });
    } catch (x) { ps.className = 'gagal'; ps.textContent = 'Gagal: ' + x.message; $('kirim').disabled = false; $('kirim').textContent = 'Kirim penerimaan'; }
  };
  muat();
</script>
</body>
</html>
