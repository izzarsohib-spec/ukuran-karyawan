<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Setujui Permintaan</title>
<style>
  :root { --bg:#e9e9ec; --kartu:#fff; --teks:#1b1b1f; --redup:#6b6b73; --garis:#c9c9d0; --bahaya:#c0392b; --ok:#1e8e4e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121214; --kartu:#1c1c20; --teks:#ececf0; --redup:#9a9aa4; --garis:#3a3a42; --bahaya:#ef6b5b; --ok:#4cc27f; } }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--teks); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:18px 16px 40px; }
  .kartu { background:var(--kartu); border:1px solid var(--garis); border-radius:16px; padding:18px; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  .sub { color:var(--redup); font-size:.88rem; margin:0 0 14px; }
  .rl { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--garis); font-size:.92rem; }
  .rl:last-of-type { border-bottom:0; }
  .rl span:first-child { color:var(--redup); }
  .rl span:last-child { text-align:right; font-weight:600; }
  .item { font-size:.88rem; color:var(--redup); padding:2px 0; }
  .tombol { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  button, a.btn { flex:1; min-width:140px; padding:13px 16px; border-radius:12px; border:1px solid var(--garis); background:transparent; color:inherit; font:inherit; font-weight:600; text-align:center; text-decoration:none; cursor:pointer; }
  button.utama { background:var(--ok); border-color:var(--ok); color:#fff; }
  button:disabled { opacity:.6; cursor:default; }
  #pesan { margin-top:12px; font-size:.92rem; }
  .gagal { color:var(--bahaya); } .sukses { color:var(--ok); font-weight:600; }
  .neg { color:var(--bahaya); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="aset/tema-ringan.css?v=1.248">
</head>
<body>
<main>
  <div class="kartu">
    <h1 id="judul">Setujui permintaan seragam</h1>
    <p class="sub" id="sub">Memuat ringkasan…</p>
    <div id="isi"></div>
    <p class="sub" id="catatTtd" hidden style="margin:12px 0 0">Dengan menekan <b>Ya, setujui</b>, tanda tangan digital Anda otomatis ditempel pada memo dan PO beserta tanggal, jam, dan kode verifikasi.</p>
    <div class="tombol" id="tombol" hidden>
      <button class="utama" id="setuju" type="button">Ya, setujui</button>
      <a class="btn" id="tolak" href="#">Tolak / Revisi</a>
    </div>
    <div id="pesan" role="status"></div>
  </div>
</main>
<script>
  // Parameter dari tombol di notifikasi: id = nomor permintaan, p = pimpinan (yasir|ferry), t = token pribadi pimpinan tersebut.
  const FN = 'https://vqcusagijiavaoljfrib.supabase.co/functions/v1/keputusan';
  const q = new URLSearchParams(location.search), id = q.get('id') || '', p = q.get('p') || '', t = q.get('t') || '';
  const $ = i => document.getElementById(i);
  let suratUrl = '';
  const nama = { yasir: 'Pak Yasir', ferry: 'Pak Ferry' }[p];
  const rp = n => 'Rp' + Math.round(Number(n) || 0).toLocaleString('id-ID');
  const baris = (k, v, cls) => { const d = document.createElement('div'); d.className = 'rl'; const a = document.createElement('span'), b = document.createElement('span'); a.textContent = k; b.textContent = v; if (cls) b.className = cls; d.append(a, b); return d; };
  async function muat() {
    if (!/^\d+$/.test(id) || !nama || t.length < 32) { $('sub').textContent = ''; $('pesan').innerHTML = '<span class="gagal">Tautan tidak valid.</span>'; return; }
    try {
      const r = await fetch(`${FN}?id=${encodeURIComponent(id)}&p=${encodeURIComponent(p)}&t=${encodeURIComponent(t)}`);
      if (!r.ok) { $('sub').textContent = ''; $('pesan').innerHTML = '<span class="gagal">Tautan tidak dikenali.</span>'; return; }
      const x = await r.json();
      $('sub').textContent = `${nama}, periksa ringkasan ini sebelum menyetujui.`;
      const isi = $('isi'); isi.textContent = '';
      isi.append(baris('Lokasi', x.client), baris('Bagian', x.bagian_kerja), baris('Anggaran RAB', rp(x.rab)), baris('Total jual', rp(x.total_jual)), baris('Total beli', rp(x.total_beli)), baris('Untung', rp(x.untung), x.untung < 0 ? 'neg' : ''));
      for (const i of x.items || []) { const d = document.createElement('div'); d.className = 'item'; d.textContent = `${i.qty} × ${i.nama}`; isi.append(d); }
      if (x.memo) { const d = document.createElement('div'); d.className = 'item'; d.textContent = 'Catatan: ' + x.memo; isi.append(d); }
      suratUrl = x.lampiran_url || '';
      if (x.lampiran_url) { const a = document.createElement('a'); a.href = x.lampiran_url; a.textContent = 'Buka surat lengkap'; a.style.cssText = 'display:inline-block;margin-top:8px;font-size:.9rem'; isi.append(a); }
      if (x.saya !== 'menunggu') { $('pesan').innerHTML = `<span class="sukses">${nama} sudah memutuskan: ${x.saya === 'disetujui' ? 'disetujui' : 'ditolak / revisi'}.</span>`; return; }
      $('tolak').href = `revisi.html?id=${encodeURIComponent(id)}&p=${encodeURIComponent(p)}&t=${encodeURIComponent(t)}`;
      $('tombol').hidden = false; $('catatTtd').hidden = false;
    } catch (e) { $('sub').textContent = ''; $('pesan').innerHTML = '<span class="gagal">Tidak bisa terhubung. Periksa koneksi lalu muat ulang.</span>'; }
  }
  $('setuju').onclick = async () => {
    $('setuju').disabled = true; $('setuju').textContent = 'Menyimpan…'; $('pesan').textContent = '';
    try {
      const r = await fetch(`${FN}?id=${encodeURIComponent(id)}&p=${encodeURIComponent(p)}&t=${encodeURIComponent(t)}&a=setuju`, { method: 'POST' });
      const teks = await r.text();
      if (r.ok) {
        $('tombol').hidden = true; $('catatTtd').hidden = true; const s = document.createElement('div'); s.className = 'sukses'; s.textContent = teks; $('pesan').append(s);
        if (suratUrl) { const a = document.createElement('a'); a.href = suratUrl; a.textContent = 'Lihat surat dengan tanda tangan Anda'; a.style.cssText = 'display:inline-block;margin-top:8px;font-size:.92rem'; $('pesan').append(a); }
      }
      else { const s = document.createElement('span'); s.className = 'gagal'; s.textContent = teks || 'Gagal menyimpan.'; $('pesan').append(s); $('setuju').disabled = false; $('setuju').textContent = 'Ya, setujui'; }
    } catch (e) { $('pesan').innerHTML = '<span class="gagal">Tidak bisa terhubung. Periksa koneksi lalu coba lagi.</span>'; $('setuju').disabled = false; $('setuju').textContent = 'Ya, setujui'; }
  };
  muat();
</script>
</body>
</html>
