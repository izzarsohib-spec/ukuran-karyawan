<style>
  :root {
    --bg:#0b0b0d; --shell:#19191c; --panel:rgba(255,255,255,.075); --panel2:rgba(255,255,255,.12); --stroke:rgba(255,255,255,.12);
    --text:#f5f5f7; --muted:#a4a4ae; --accent:#f5d547; --ok:#b9f36f; --warn:#fbbf24; --bad:#ff8a80;
    --head:"Syne", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  html { color-scheme:dark; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1, h2, h3 { font-family:var(--head); margin:0; letter-spacing:-.01em; }
  button, input, select { font:inherit; color:inherit; }
  .shell { position:relative; margin:16px; min-height:calc(100vh - 32px); background:var(--shell); border:1px solid var(--stroke); border-radius:34px; overflow:clip; }
  .shell::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(52% 38% at 52% 10%, rgba(255,122,47,.45), transparent 72%), radial-gradient(34% 30% at 100% 2%, rgba(255,196,96,.22), transparent 72%); }
  main { position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:34px 28px 56px; }
  .kop h1 { font-size:clamp(1.3rem, 2.4vw, 2rem); letter-spacing:.01em; }
  .kop .perusahaan { font-family:var(--head); font-weight:700; font-size:.95rem; letter-spacing:.14em; color:var(--accent); margin:6px 0 4px; }
  .kop .sub { color:var(--muted); }
  /* sidebar menu: satu kelompok per bidang (Seragam, Peralatan, Chemical, Organisasi, Sistem) */
  .bagian { display:flex; gap:26px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--stroke); margin:22px 0 12px; }
  .bagian button { flex:none; padding:10px 2px; margin-bottom:-1px; border:0; border-bottom:2px solid transparent; background:none; cursor:pointer; color:var(--muted); font-size:.92rem; font-weight:500; white-space:nowrap; }
  .bagian button:hover { color:var(--text); } .bagian button.on { color:#fff; font-weight:700; border-bottom-color:var(--accent); }
  .dalam .bagian { display:none; } .dalam .chips { margin-top:22px; }
  .bagian .tag { font-size:.64rem; font-weight:600; padding:1px 7px; border-radius:99px; background:rgba(255,255,255,.1); margin-left:6px; vertical-align:middle; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; min-height:36px; align-items:center; }
  .chip { border:1px solid var(--stroke); background:rgba(255,255,255,.05); border-radius:99px; padding:7px 16px; cursor:pointer; font-size:.86rem; color:var(--muted); font-weight:600; }
  .chip:hover { background:var(--panel2); color:var(--text); } .chip.on { background:var(--panel2); color:var(--text); border-color:rgba(255,255,255,.35); }
  .chip .kunci { font-size:.7rem; opacity:.7; margin-left:4px; }
  .chips .segera { color:var(--muted); font-size:.86rem; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin:0 0 14px; }
  .kpi { background:var(--panel); border:1px solid var(--stroke); border-radius:20px; padding:14px 16px; }
  .kpi .l { color:var(--muted); font-size:.78rem; } .kpi .v { font-family:var(--head); font-size:1.3rem; margin-top:2px; }
  .card { background:var(--panel); border:1px solid var(--stroke); border-radius:24px; padding:18px 18px 14px; }
  .ket { color:var(--muted); font-size:.88rem; margin:0 0 14px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .bar input[type=search], .bar select { background:rgba(255,255,255,.06); border:1px solid var(--stroke); border-radius:14px; padding:9px 13px; min-width:0; }
  .bar input[type=search] { flex:1 1 220px; max-width:360px; }
  .bar select option { background:#202024; }
  .btn { border:1px solid var(--stroke); background:rgba(255,255,255,.07); border-radius:99px; padding:7px 15px; cursor:pointer; font-weight:600; font-size:.84rem; }
  .btn:hover { background:var(--panel2); } .btn:disabled { opacity:.55; cursor:wait; }
  .btn.cta { background:var(--accent); color:#0b0b0d; border-color:transparent; } .btn.cta:hover { filter:brightness(1.08); }
  .btn.bahaya { color:var(--bad); border-color:rgba(255,138,128,.4); }
  /* area tabel setinggi layar: batang gulir (mendatar dan tegak) selalu terlihat, judul kolom tetap di atas */
  .wrap { overflow:auto; max-height:max(360px, calc(100vh - 150px)); border-radius:14px; }
  table { width:100%; border-collapse:collapse; font-size:.84rem; }
  th { text-align:left; vertical-align:middle; color:#cfcfd6; font-weight:700; font-size:.78rem; letter-spacing:.02em; padding:11px 7px; border-bottom:0; position:sticky; top:0; background:#26262b; z-index:1; white-space:nowrap; }
  th:first-child, td:first-child { padding-left:12px; } th:last-child, td:last-child { padding-right:12px; }
  td { padding:8px 7px; border-bottom:1px solid rgba(255,255,255,.06); vertical-align:top; }
  tr:hover td { background:rgba(255,255,255,.03); }
  th.r, td.r { text-align:right; font-variant-numeric:tabular-nums; }
  td .sub { color:var(--muted); font-size:.76rem; }
  td.aksi { text-align:right; width:1%; } td.aksi .btn { padding:4px 11px; font-size:.78rem; margin:0 0 4px 4px; }
  tr.mati td { opacity:.5; }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.72rem; font-weight:600; background:rgba(255,255,255,.1); color:var(--muted); }
  .badge.ok { background:rgba(185,243,111,.14); color:var(--ok); } .badge.warn { background:rgba(251,191,36,.16); color:var(--warn); } .badge.bad { background:rgba(255,138,128,.16); color:var(--bad); }
  .form { background:rgba(0,0,0,.25); border:1px solid var(--stroke); border-radius:20px; padding:16px; margin-bottom:14px; }
  .form h3 { font-size:1.05rem; margin-bottom:12px; }
  .fg { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:12px 14px; }
  .fg label { font-size:.78rem; color:var(--muted); display:block; }
  .fg input:not([type=checkbox]), .fg select { display:block; width:100%; margin-top:4px; background:rgba(255,255,255,.07); border:1px solid var(--stroke); border-radius:12px; padding:9px 11px; }
  .fg input[readonly] { opacity:.6; } .fg select option { background:#202024; }
  .fg .cek { display:flex; align-items:center; gap:8px; padding-top:22px; color:var(--text); } .fg .cek input { width:auto; margin:0; }
  .fg .hint { color:var(--muted); font-size:.72rem; margin-top:3px; }
  .fa { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  .pesan { font-size:.86rem; margin:8px 0; min-height:1.2em; } .pesan.ok { color:var(--ok); } .pesan.bad { color:var(--bad); }
  .bingkai { width:100%; height:80vh; min-height:520px; border:0; border-radius:14px; background:transparent; }
  .massal { display:flex; gap:10px; flex-wrap:wrap; align-items:center; background:rgba(245,213,71,.08); border:1px solid rgba(245,213,71,.3); border-radius:16px; padding:10px 14px; margin-bottom:12px; }
  .massal select { background:rgba(255,255,255,.07); border:1px solid var(--stroke); border-radius:12px; padding:7px 11px; min-width:0; } .massal select option { background:#202024; }
  .kosong { color:var(--muted); padding:26px 10px; text-align:center; }
  .kunci-info { text-align:center; padding:34px 16px; } .kunci-info p { color:var(--muted); max-width:460px; margin:6px auto 16px; }
  .log td.diff { max-width:520px; overflow-wrap:anywhere; font-size:.8rem; color:var(--muted); }
  @media (max-width:640px) { .shell { margin:0; border-radius:0; border:0; } main { padding:22px 14px 40px; } .card { padding:14px 12px; } }

<script>
  const SUPABASE_URL = 'https://vqcusagijiavaoljfrib.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxY3VzYWdpamlhdmFvbGpmcmliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0OTIzOTksImV4cCI6MjEwODA2ODM5OX0.VeslVR4UHv26LCMbkO7KP0k96r8lg7-NNLjY30iMyFk';
  const H = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = n => (Number(n) || 0).toLocaleString('id-ID');
  const rp = n => 'Rp' + Math.round(Number(n) || 0).toLocaleString('id-ID');
  const rpR = n => { const v = Math.abs(Number(n) || 0); return v >= 1e9 ? 'Rp' + (v / 1e9).toFixed(2).replace('.', ',') + ' M' : v >= 1e6 ? 'Rp' + (v / 1e6).toFixed(1).replace('.', ',') + ' jt' : rp(v); };
  const waktu = d => d ? new Date(d).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  const uniq = (a, f) => [...new Set(a.map(f).filter(x => x != null && x !== ''))].sort((x, y) => String(x).localeCompare(String(y), 'id', { numeric: true }));

  async function rpc(fn, body) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.message || 'HTTP ' + r.status); e.login = /login admin diperlukan/.test(j.message || ''); throw e; }
    return j;
  }
  // menulis/membaca data tertutup: belum login -> tampilkan layar masuk dulu (server tetap memeriksa admin)
  async function tulis(fn, body) { await Masuk.wajib(); return rpc(fn, { kode: 'sesi', ...body }); }

  const GALAT_LOGIN = 'Sesi login berakhir atau akun tidak punya akses admin. Masuk lagi.';
  const TBL = { acuan_rekap: 'Anggaran seragam', harga_seragam: 'Harga seragam', peralatan_lokasi: 'Lokasi peralatan', peralatan_item: 'Peralatan', ukuran_pekerja: 'Karyawan', cabang: 'Cabang', pic_lapangan: 'PIC lapangan', lokasi_penugasan: 'Penugasan lokasi' };
  const intOrNull = v => v === '' || v == null ? null : Math.round(Number(v));
  const numOrNull = v => v === '' || v == null ? null : Number(v);

  // ---------------- definisi tab ----------------
  // muat: ambil data; kolom: [judul, fungsi sel, 'r' bila rata kanan]; form(r): daftar isian (r kosong = tambah); simpan/hapus: panggil server
  let ACUAN = [], CAB = [], PICS = [];
  const opsiCab = (aktifSaja = true) => CAB.filter(c => !aktifSaja || c.aktif).map(c => [c.id, c.nama]);
  const opsiPic = cab => PICS.filter(p => p.aktif && String(p.cabang_id) === String(cab)).map(p => [p.id, p.nama]);
  const TABS = {
    acuan: {
      grup: 'Seragam', nama: 'Anggaran & anggota', ket: 'RAB seragam, jumlah anggota, bagian kerja, dan masa kontrak per lokasi (dipakai di halaman Seragam). Nama lokasi harus sama dengan pilihan lokasi di Google Form supaya pengisian ukuran terhitung.',
      muat: () => rpc('admin_daftar_acuan'), cari: r => [r.client, r.lokasi_form, r.bagian_kerja].join(' '), id: r => r.id, lokasiDari: r => r.lokasi_form,
      kolom: [['Client / lokasi', r => `<b>${esc(r.client)}</b>${r.client !== r.lokasi_form ? `<div class="sub">${esc(r.lokasi_form)}</div>` : ''}`], ['Bagian kerja', r => esc(r.bagian_kerja)], ['Anggota', r => num(r.jumlah_anggota), 'r'],
        ['Anggaran', r => rp(r.anggaran), 'r'], ['Kontrak', r => r.masa_kontrak + ' bln', 'r'], ['Per orang/bln', r => rp(r.anggaran_per_orang), 'r'], ['Karyawan', r => num(r.karyawan), 'r'], ['Permintaan', r => num(r.riwayat), 'r']],
      kpi: d => [['Baris anggaran', num(d.length)], ['Lokasi', num(uniq(d, r => r.lokasi_form).length)], ['Total anggota', num(d.reduce((a, r) => a + r.jumlah_anggota, 0))], ['Total anggaran', rpR(d.reduce((a, r) => a + Number(r.anggaran), 0))]],
      form: r => [
        { k: 'client', l: 'Client', v: r?.client, hint: 'Kosong = sama dengan lokasi' },
        { k: 'lokasi', l: 'Lokasi (sama dengan Google Form)', v: r?.lokasi_form, ro: !!r, req: !r },
        { k: 'bagian', l: 'Bagian kerja', v: r?.bagian_kerja, ro: !!r, req: !r, list: uniq(ACUAN, x => x.bagian_kerja) },
        { k: 'anggota', l: 'Jumlah anggota', t: 'number', v: r?.jumlah_anggota, req: true, min: 0 },
        { k: 'anggaran', l: 'Anggaran total (Rp)', t: 'number', v: r?.anggaran, req: true, min: 0 },
        { k: 'masa', l: 'Masa kontrak (bulan)', t: 'number', v: r?.masa_kontrak ?? 12, req: true, min: 1 },
        { k: 'per', l: 'Anggaran per orang/bulan', t: 'number', v: r ? Number(r.anggaran_per_orang) : '', hint: 'Kosong = dihitung otomatis' }],
      simpan: (v, r) => tulis('admin_simpan_acuan', { p_id: r?.id ?? null, p_client: v.client, p_lokasi: v.lokasi, p_bagian: v.bagian, p_anggota: intOrNull(v.anggota), p_anggaran: intOrNull(v.anggaran), p_masa: intOrNull(v.masa), p_per_orang: numOrNull(v.per) }),
      hapus: r => tulis('admin_hapus_acuan', { p_id: r.id }), namaBaris: r => `${r.client} - ${r.bagian_kerja}`
    },
    laporan: {
      grup: 'Seragam', nama: 'Laporan harian', frame: '../seragam/#laporan',
      ket: 'Laporan harian kegiatan, kendala, dan rencana, lengkap dengan rekap aktivitas hari itu. Menyimpan catatan butuh login admin.'
    },
    harga: {
      grup: 'Seragam', nama: 'Jenis & harga seragam', ket: 'Daftar seragam dan harga beli/jual. Harga yang diubah berlaku untuk permintaan baru; permintaan lama tetap memakai harga saat dibuat.',
      muat: () => rpc('admin_daftar_harga_seragam'), cari: r => [r.kategori, r.nama].join(' '), id: r => r.no,
      kolom: [['No', r => r.no, 'r'], ['Kategori', r => esc(r.kategori)], ['Nama', r => `<b>${esc(r.nama)}</b>`], ['Terdiri dari', r => esc(({ 'baju+celana': 'Baju + celana', baju: 'Baju', celana: 'Celana', sepatu: 'Sepatu', aksesoris: 'Aksesoris' })[r.komponen] || r.komponen)], ['Harga beli', r => rp(r.harga_beli), 'r'], ['Harga jual', r => rp(r.harga_jual), 'r'], ['Selisih', r => rp(r.harga_jual - r.harga_beli), 'r'], ['Dipakai', r => num(r.dipakai), 'r']],
      kpi: d => [['Jenis seragam', num(d.length)], ['Kategori', num(uniq(d, r => r.kategori).length)], ['Rata-rata selisih', rp(d.length ? d.reduce((a, r) => a + (r.harga_jual - r.harga_beli), 0) / d.length : 0)]],
      form: r => [
        { k: 'kategori', l: 'Kategori', v: r?.kategori, req: true, list: uniq(DATA.harga || [], x => x.kategori) },
        { k: 'nama', l: 'Nama seragam', v: r?.nama, req: true },
        { k: 'komponen', l: 'Terdiri dari', v: r?.komponen || 'baju+celana', req: true, sel: [['baju+celana', 'Baju + celana (setelan)'], ['baju', 'Baju saja'], ['celana', 'Celana saja'], ['sepatu', 'Sepatu'], ['aksesoris', 'Aksesoris']], hint: 'Menentukan ukuran yang diminta dan cara barang dipecah di rekap, PO, dan kekurangan vendor' },
        { k: 'beli', l: 'Harga beli (Rp)', t: 'number', v: r?.harga_beli, req: true, min: 0 },
        { k: 'jual', l: 'Harga jual (Rp)', t: 'number', v: r?.harga_jual, req: true, min: 0 }],
      simpan: (v, r) => tulis('admin_simpan_harga_seragam', { p_no: r?.no ?? null, p_kategori: v.kategori, p_nama: v.nama, p_beli: intOrNull(v.beli), p_jual: intOrNull(v.jual), p_komponen: v.komponen }),
      hapus: r => tulis('admin_hapus_harga_seragam', { p_no: r.no }), namaBaris: r => r.nama
    },
    lokasi: {
      grup: 'Peralatan', nama: 'Lokasi & RAB', ket: 'Lokasi untuk modul Peralatan: RAB, jumlah anggota, lama kontrak, dan pemetaan ke anggaran seragam. Lokasi yang sudah punya permintaan hanya bisa dinonaktifkan.',
      muat: () => rpc('peralatan_kelola_lokasi'), cari: r => [r.nama, r.bagian].join(' '), id: r => r.id, mati: r => !r.aktif, lokasiDari: r => r.nama,
      statusOpsi: [['semua', 'Semua status'], ['aktif', 'Aktif', r => r.aktif], ['nonaktif', 'Nonaktif', r => !r.aktif], ['tanpa', 'Belum dipetakan ke anggaran seragam', r => !r.seragam_lokasi_form], ['baru', 'Ditambahkan lewat web', r => !r.dari_sumber]],
      kolom: [['Lokasi', r => `<b>${esc(r.nama)}</b><div class="sub">${esc(r.bagian || '')}${r.dari_sumber ? '' : ' · ditambah lewat web'}</div>`], ['Anggota', r => num(r.anggota), 'r'], ['Kontrak', r => (r.kontrak_bulan || '-') + ' bln' + (r.kontrak_mulai ? `<div class="sub">sejak ${esc(r.kontrak_mulai)}</div>` : ''), 'r'], ['RAB', r => rp(r.rab), 'r'],
        ['Anggaran seragam', r => r.seragam_lokasi_form ? esc(r.seragam_lokasi_form) : '<span class="sub">belum dipetakan</span>'], ['Permintaan', r => num(r.jumlah_permintaan), 'r'], ['Status', r => r.aktif ? '<span class="badge ok">Aktif</span>' : '<span class="badge">Nonaktif</span>']],
      kpi: d => [['Lokasi', num(d.length)], ['Aktif', num(d.filter(r => r.aktif).length)], ['Total RAB', rpR(d.reduce((a, r) => a + Number(r.rab || 0), 0))], ['Belum dipetakan', num(d.filter(r => !r.seragam_lokasi_form).length)]],
      form: r => [
        { k: 'nama', l: 'Nama lokasi', v: r?.nama, req: true }, { k: 'bagian', l: 'Bagian kerja', v: r?.bagian || 'KEAMANAN' },
        { k: 'anggota', l: 'Jumlah anggota', t: 'number', v: r?.anggota, min: 0 }, { k: 'kontrak', l: 'Lama kontrak (bulan)', t: 'number', v: r?.kontrak_bulan ?? 12, min: 1 },
        { k: 'per', l: 'Anggaran per orang/bulan (Rp)', t: 'number', v: r ? Number(r.anggaran_per_orang) || '' : '', hint: 'RAB = per orang × anggota × bulan' },
        { k: 'rab', l: 'RAB peralatan (Rp)', t: 'number', v: r ? Number(r.rab) : '', req: true, min: 0 },
        { k: 'seragam', l: 'Anggaran seragam yang dipakai', sel: [['', '(belum dipetakan)'], ...uniq(ACUAN, x => x.lokasi_form).map(x => [x, x])], v: r?.seragam_lokasi_form || '' },
        { k: 'mulai', l: 'Awal masa kontrak saat ini', t: 'date', v: r?.kontrak_mulai || '', hint: 'Permintaan sebelum tanggal ini dianggap kontrak lama di riwayat' },
        ...(r ? [{ k: 'aktif', l: 'Lokasi aktif', cek: true, v: r.aktif }] : [])],
      hitung: v => { const a = Number(v.per) * Number(v.anggota) * Number(v.kontrak); return a > 0 ? { rab: Math.round(a) } : null; },
      simpan: async (v, r) => {
        const id = await tulis('peralatan_simpan_lokasi', { p_id: r?.id ?? null, p_nama: v.nama, p_bagian: v.bagian, p_anggota: intOrNull(v.anggota), p_kontrak: intOrNull(v.kontrak), p_per_orang: numOrNull(v.per), p_rab: numOrNull(v.rab), p_seragam: v.seragam || '', p_aktif: r ? !!v.aktif : true });
        if ((v.mulai || '') !== (r?.kontrak_mulai || '')) await tulis('peralatan_atur_kontrak', { p_lokasi: id, p_mulai: v.mulai || null });
      },
      hapus: r => tulis('admin_hapus_lokasi_peralatan', { p_id: r.id }), namaBaris: r => r.nama

    const b = baris(), tampil = b.slice(0, batas);
    $('isi').innerHTML = `<div class="bar"><input type="search" id="cari" placeholder="Cari…" value="${esc(q)}">${filter}${t.simpan && !t.tanpaTambah ? '<button class="btn cta" id="btnTambah">+ Tambah</button>' : ''}<span class="sub" style="color:var(--muted);font-size:.8rem">${num(b.length)} baris</span></div>
      ${t.massal ? `<div class="massal"><b>Penugasan massal</b><span class="sub">untuk ${num(b.length)} lokasi yang tampil sekarang</span><select id="bCab"><option value="">Pilih cabang</option>${opsiCab().map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')}</select><select id="bPic"><option value="">(tanpa PIC)</option></select><button class="btn cta" id="btnMassal">Terapkan</button></div>` : ''}
      <div id="formArea">${edit !== undefined ? formHtml() : ''}</div><div class="pesan ${pesan ? pesan[0] : ''}" id="pesan">${pesan ? esc(pesan[1]) : ''}</div>
      <div class="wrap"><table class="${t.log ? 'log' : ''}"><thead><tr>${t.kolom.map(c => `<th class="${c[2] === 'r' ? 'r' : ''}">${esc(c[0])}</th>`).join('')}${t.simpan || t.hapus ? '<th></th>' : ''}</tr></thead>
      <tbody>${tampil.map(r => `<tr class="${t.mati && t.mati(r) ? 'mati' : ''}">${t.kolom.map(c => `<td class="${c[2] || ''}">${c[2] === 'diff' ? esc(c[1](r)) : c[1](r)}</td>`).join('')}${t.simpan || t.hapus ? `<td class="aksi" data-i="${esc(t.id(r))}">${(t.aksiLain ? t.aksiLain(r) : []).map(([a, l]) => `<button class="btn" data-a="${a}">${l}</button>`).join('')}${t.simpan ? '<button class="btn" data-a="ubah">Ubah</button>' : ''}${t.hapus ? '<button class="btn bahaya" data-a="hapus">Hapus</button>' : ''}</td>` : ''}</tr>`).join('') || `<tr><td colspan="${t.kolom.length + 1}" class="kosong">Tidak ada data.</td></tr>`}</tbody></table></div>
      ${b.length > batas ? `<div style="text-align:center;margin-top:12px"><button class="btn" id="btnLagi">Tampilkan 100 lagi (${num(b.length - batas)} tersisa)</button></div>` : ''}`;
    if (edit !== undefined) isiBagian();
  }

  // ---------------- form tambah/ubah ----------------
  function formHtml() {
    const t = cfg(), r = edit, f = t.form(r);
    return `<form class="form" id="form"><h3>${r ? 'Ubah: ' + esc(t.namaBaris(r)) : 'Tambah data baru'}</h3><div class="fg">${f.map(x => {
      const v = x.v ?? '';
      if (x.cek) return `<label class="cek"><input type="checkbox" name="${x.k}" ${v ? 'checked' : ''}> ${esc(x.l)}</label>`;
      if (x.sel) return `<label>${esc(x.l)}<select name="${x.k}" ${x.req ? 'required' : ''}>${!x.req || !v ? (x.req ? '<option value="">Pilih…</option>' : '') : ''}${x.sel.map(([a, b]) => `<option value="${esc(a)}" ${String(a) === String(v) ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></label>`;
      const dl = x.list ? `list="dl-${x.k}"` : '';
      return `<label>${esc(x.l)}<input name="${x.k}" type="${x.t || 'text'}" value="${esc(v)}" ${x.ro ? 'readonly' : ''} ${x.req ? 'required' : ''} ${x.min != null ? `min="${x.min}"` : ''} ${x.t === 'number' ? 'step="any"' : ''} ${dl} autocomplete="off">${x.list ? `<datalist id="dl-${x.k}">${x.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}${x.hint ? `<div class="hint">${esc(x.hint)}</div>` : ''}</label>`;
    }).join('')}</div>
      <div class="fa"><button class="btn cta" type="submit" id="btnSimpan">Simpan</button><button class="btn" type="button" id="btnBatal">Batal</button>${t.hitung ? '<button class="btn" type="button" id="btnHitung">Hitung RAB otomatis</button>' : ''}<span class="sub" style="color:var(--muted);font-size:.78rem">Perlu login admin untuk menyimpan.</span></div></form>`;
  }
  // bagian kerja karyawan bergantung pada lokasi yang dipilih
  // pilihan PIC mengikuti cabang (form penugasan dan bar penugasan massal)
  function isiPic(selCab, selPic, pilih) {
    if (!selCab || !selPic) return; const ada = pilih || selPic.value;
    selPic.innerHTML = '<option value="">(tanpa PIC)</option>' + opsiPic(selCab.value).map(([v, l]) => `<option value="${v}" ${String(v) === String(ada) ? 'selected' : ''}>${esc(l)}</option>`).join('');
  }
  function isiBagian() {
    const f = $('form'); if (!f || tab !== 'karyawan' || !f.lokasi) return;
    const pilih = edit?.bagian_kerja, sekarang = f.bagian.value || pilih || '';
    const opsi = ACUAN.filter(a => a.lokasi_form === f.lokasi.value).map(a => a.bagian_kerja);
    f.bagian.innerHTML = '<option value="">Pilih…</option>' + opsi.map(o => `<option value="${esc(o)}" ${o === sekarang ? 'selected' : ''}>${esc(o)}</option>`).join('');
  }
  const nilaiForm = f => Object.fromEntries([...new FormData(f).entries()].map(([k, v]) => [k, typeof v === 'string' ? v.trim() : v]).concat([...f.querySelectorAll('input[type=checkbox]')].map(c => [c.name, c.checked])));
  function bukaForm(r) { edit = r || null; pesan = null; gambar(); const f = $('form'); if (f) { f.scrollIntoView({ behavior: 'smooth', block: 'center' }); const a = f.querySelector('input:not([readonly]),select'); if (a) a.focus(); } }

  async function jalankan(fn, sukses, tombol) {
    if (tombol) tombol.disabled = true; pesan = ['', 'Memproses…']; const p = $('pesan'); if (p) { p.className = 'pesan'; p.textContent = 'Memproses…'; }
    try { await fn(); pesan = ['ok', sukses]; edit = undefined; await muatTab(true); }
    catch (e) { pesan = ['bad', e.login ? GALAT_LOGIN : /Dibatalkan/.test(e.message) ? 'Dibatalkan: login diperlukan untuk menyimpan.' : e.message]; gambar(); }
  }

  // ---------------- peristiwa ----------------
  document.addEventListener('click', async e => {
    const t = cfg(), el = e.target.closest('[data-t],[data-g]') || e.target;
    if (el.dataset.g) { // pilih bidang: tampilkan menunya; buka menu pertama bila belum ada yang terbuka di bidang itu
      bagianPilih = el.dataset.g; const pertama = Object.keys(TABS).find(k => TABS[k].grup === bagianPilih);
      if (pertama && TABS[tab].grup !== bagianPilih) { tab = pertama; q = ''; saring = {}; batas = 100; edit = undefined; pesan = null; gambarTab(); return muatTab(false); }
      return gambarTab();
    }
    if (el.dataset.t) { bagianPilih = null; tab = el.dataset.t; q = ''; saring = {}; batas = 100; edit = undefined; pesan = null; gambarTab(); return muatTab(false); }
    if (el.id === 'btnMasuk') return Masuk.wajib().catch(() => {});
    if (el.id === 'btnTambah') return bukaForm(null);
    if (el.id === 'btnMassal') {
      const lok = baris().map(r => r.lokasi), cab = intOrNull($('bCab').value), pic = intOrNull($('bPic').value);
      if (!lok.length) { pesan = ['bad', 'Tidak ada lokasi yang tampil.']; return gambar(); }
      if (!cab) { pesan = ['bad', 'Pilih cabang dulu.']; return gambar(); }
      const nc = CAB.find(c => c.id === cab).nama, np = pic ? PICS.find(p => p.id === pic).nama : 'tanpa PIC';
      if (!confirm(`Tetapkan ${lok.length} lokasi ke cabang ${nc}, PIC: ${np}?\n\nPenugasan lama pada lokasi-lokasi ini akan diganti. Perubahan tercatat di log.`)) return;
      return jalankan(() => tulis('admin_simpan_penugasan', { p_lokasi: lok, p_cabang: cab, p_pic: pic }), `${lok.length} lokasi ditetapkan ke ${nc} (${np}).`, el);
    }
    if (el.id === 'btnBatal') { edit = undefined; pesan = null; return gambar(); }
    if (el.id === 'btnLagi') { batas += 100; return gambar(); }
    if (el.id === 'btnHitung') { const h = t.hitung(nilaiForm($('form'))); if (h) { $('form').rab.value = h.rab; $('pesan').className = 'pesan ok'; $('pesan').textContent = 'RAB diisi dari per orang × anggota × bulan.'; } else { $('pesan').className = 'pesan bad'; $('pesan').textContent = 'Isi anggaran per orang, jumlah anggota, dan lama kontrak dulu.'; } return; }
    const a = el.dataset.a; if (!a) return;
    const r = (DATA[tab] || []).find(x => String(t.id(x)) === el.closest('td').dataset.i); if (!r) return;
    if (a === 'ubah') return bukaForm(r);
    if (a === 'hapus') { if (!confirm(`Hapus permanen "${t.namaBaris(r)}"?\n\nData yang sudah punya riwayat akan ditolak otomatis. Penghapusan tercatat di log.`)) return; return jalankan(() => t.hapus(r), `"${t.namaBaris(r)}" dihapus.`, el); }
    if (a === 'keluar' || a === 'aktif') { const keluar = a === 'keluar'; if (!confirm(keluar ? `Tandai "${r.nama}" sudah keluar per hari ini?\nRiwayatnya tetap tersimpan dan bisa diaktifkan lagi.` : `Aktifkan kembali "${r.nama}"?`)) return; return jalankan(() => tulis('admin_status_karyawan', { p_id: r.id, p_aktif: !keluar, p_tanggal: null }), keluar ? `${r.nama} ditandai keluar.` : `${r.nama} aktif kembali.`, el); }
    if (a === 'riwayat') {
      try { const l = await tulis('admin_log', { p_tabel: 'ukuran_pekerja', p_kunci: String(r.id), p_batas: 100 });
        const teks = l.length ? l.map(x => `${waktu(x.waktu)} · ${x.pengguna}\n   ${x.aksi === 'delete' ? 'dihapus' : x.aksi === 'insert' ? 'ditambahkan' : ringkasLog(x)}`).join('\n\n') : 'Belum ada perubahan tercatat untuk karyawan ini.';
        alert(`Riwayat: ${r.nama}\n\n${teks}`); } catch (err) { alert(err.login ? GALAT_LOGIN : err.message); }
    }
  });
  document.addEventListener('input', e => { if (e.target.id === 'cari') { q = e.target.value; batas = 100; const pos = e.target.selectionStart; gambar(); const c = $('cari'); c.focus(); c.setSelectionRange(pos, pos); } });
  document.addEventListener('change', e => {
    if (e.target.dataset.s) { saring[e.target.dataset.s] = e.target.value; batas = 100; gambar(); }
    if (e.target.name === 'lokasi' && tab === 'karyawan') isiBagian();
    if (e.target.name === 'cabang' && tab === 'penugasan') isiPic($('form').cabang, $('form').pic, '');
    if (e.target.id === 'bCab') isiPic($('bCab'), $('bPic'), '');
  });
  document.addEventListener('submit', e => {
    if (e.target.id !== 'form') return; e.preventDefault();
    const t = cfg(), r = edit, v = nilaiForm(e.target);
    jalankan(() => t.simpan(v, r), r ? 'Perubahan disimpan.' : 'Data baru ditambahkan.', $('btnSimpan'));
  });
  window.addEventListener('masuk-ubah', () => { if (cfg().login) { DATA[tab] = null; muatTab(true); } });

  // filter cabang / PIC dari portal: gambar ulang tab yang datanya per lokasi
  window.addEventListener('saring-ubah', () => { if (DATA[tab] && !cfg().frame) gambar(); });
  Saring.siap.then(() => { if (DATA[tab] && !cfg().frame) gambar(); });
  // Di dalam portal, bidang (Seragam, Peralatan, Chemical, Organisasi, Sistem) dipilih dari bar atas portal lewat hash (#seragam, #organisasi, ...);
  // hash berisi nama menu (#lokasi_pic dst.) tetap diterima. Di luar portal, baris bidang tampil sendiri.
  if (window.self !== window.top) document.documentElement.classList.add('dalam');
  const BIDANG = ['Seragam', 'Peralatan', 'Chemical', 'Organisasi', 'Sistem'];
  function terapkanHash() {
    const h = decodeURIComponent(location.hash.slice(1)), g = BIDANG.find(x => x.toLowerCase() === h);
    if (TABS[h]) { tab = h; bagianPilih = null; return true; }
    if (!g) return false;
    bagianPilih = g; const pertama = Object.keys(TABS).find(k => TABS[k].grup === g);
    if (pertama && TABS[tab].grup !== g) tab = pertama;
    return true;
  }
  function tampilBidangKosong() { if (!bagianPilih || Object.values(TABS).some(t => t.grup === bagianPilih)) return false; $('kpis').innerHTML = ''; $('ket').textContent = ''; $('isi').innerHTML = `<div class="kosong">Bidang ${esc(bagianPilih)} belum punya data. Segera hadir.</div>`; return true; }
  window.addEventListener('hashchange', () => { if (!terapkanHash()) return; q = ''; saring = {}; batas = 100; edit = undefined; pesan = null; gambarTab(); if (!tampilBidangKosong()) muatTab(false); });
  terapkanHash(); gambarTab(); if (!tampilBidangKosong()) muatTab(false);
  // segarkan otomatis tiap 30 detik: hanya tabel yang sedang tampil, tanpa pesan "Memuat", digambar ulang hanya bila datanya berubah;
  // dilewati saat tab tersembunyi, ada baris yang sedang diedit, atau kursor di kolom isian
  let segarJalan = false;
  async function segarkan(paksa) {
    const t = cfg();
    if (segarJalan || document.hidden || t.frame || perluLogin() || !DATA[tab] || edit !== undefined) return;
    const f = document.activeElement;
    if (!paksa && f && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName)) return;
    segarJalan = true; const tabIni = tab;
    try {
      if (t.pra) await t.pra();
      const baru = await t.muat();
      if (tab === tabIni && edit === undefined && JSON.stringify(baru) !== JSON.stringify(DATA[tabIni])) { DATA[tabIni] = baru; if (tabIni === 'acuan') ACUAN = baru; gambar(); }
    } catch (e) { /* coba lagi pada putaran berikutnya */ }
    segarJalan = false;
  }
  setInterval(segarkan, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) segarkan(true); });
</script>
</body>
</html>
