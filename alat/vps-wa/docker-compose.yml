# n8n + WAHA untuk VPS yang SUDAH menjalankan Caddy milik ntfy (/opt/ntfy): keduanya bergabung ke jaringan ntfy_default
# dan diberi alamat HTTPS lewat Caddy itu (lihat pasang.sh). Rahasia dibaca dari .env (tidak ada di repo).
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://${DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      N8N_PROXY_HOPS: "1"
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [ntfy_default]
  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    # hanya dari VPS sendiri (QR dibuka lewat terowongan SSH) dan dari kontainer lain di jaringan
    ports: ["127.0.0.1:3001:3000"]
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_API_KEY}
      TZ: Asia/Jakarta
    volumes:
      - waha_sessions:/app/.sessions
    networks: [ntfy_default]
volumes:
  n8n_data:
  waha_sessions:
networks:
  ntfy_default:
    external: true
